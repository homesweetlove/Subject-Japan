name: Add Expo package (branch only)

# pkg/ 로 시작하는 가지에서만 동작합니다. main에는 절대 직접 올리지 않고,
# 같은 가지에만 package.json / package-lock.json 변경을 커밋합니다.
on:
  push:
    branches: ['pkg/**']
    paths:
      - .github/expo-packages.txt
      - .github/workflows/add-package.yml

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Align Expo SDK 57 dependencies
        run: |
          npm install expo@~57.0.34
          npx expo install --fix
      - name: Print lockfile delta
        run: |
          node -e 'const fs=require("fs"),cp=require("child_process"),a=JSON.parse(cp.execSync("git show HEAD:package-lock.json",{maxBuffer:10000000})),b=JSON.parse(fs.readFileSync("package-lock.json","utf8")); const d={};for(const k of new Set([...Object.keys(a.packages),...Object.keys(b.packages)])){if(JSON.stringify(a.packages[k])!==JSON.stringify(b.packages[k]))d[k]=b.packages[k]??null;} console.log("LOCK_DELTA="+JSON.stringify(d));console.log("PACKAGE_JSON="+JSON.stringify(JSON.parse(fs.readFileSync("package.json","utf8"))));'
          git diff --stat -- package.json package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx expo-doctor
