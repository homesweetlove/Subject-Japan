plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.subjectlocalstore'
version = '0.1.0'

dependencies {
  implementation 'androidx.room:room-runtime:2.8.5'
  // All Room-annotated types are Java. The Kotlin Expo bridge has no Room annotations.
  annotationProcessor 'androidx.room:room-compiler:2.8.5'
}
android {
  namespace 'expo.modules.subjectlocalstore'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}
