plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.subjecttranslator'
version = '0.1.0'

dependencies {
  implementation 'com.google.mlkit:translate:17.0.3'
}

android {
  namespace "expo.modules.subjecttranslator"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
